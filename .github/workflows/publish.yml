name: Publish to PyPI

on:
  release:
    types:
      - published
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: streamlit_lexical_extended/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Verify release tag
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "Error: Tag version ($TAG_VERSION) does not match pyproject.toml version ($VERSION)"
              exit 1
            fi
            echo "Verified tag $GITHUB_REF_NAME matches pyproject.toml version $VERSION"
          else
            echo "Publishing version $VERSION from ref $GITHUB_REF_NAME"
          fi
      - name: Build frontend
        working-directory: streamlit_lexical_extended/frontend
        run: |
          npm ci
          npm run build
      - name: Build and check distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
